name: TWM Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile Python
        run: python -m compileall -q streamlit_app.py runtime tests scripts
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Schema tests
        run: python -m unittest discover -s tests -v
      - name: Download and verify canonical weights
        run: |
          python - <<'PY'
          from runtime.weight_bootstrap import ensure_canonical_weights
          ensure_canonical_weights()
          from runtime.engine import verify_integrity
          hashes = verify_integrity()
          print("integrity PASS", len(hashes))
          PY
      - name: Direct neural smoke
        run: python -m runtime.cli --scenario examples/station_7.json --seed 17 --actions 3
